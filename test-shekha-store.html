<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء متجر شيخة التجريبي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }
        
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
        
        .status.loading {
            background: #e7f3ff;
            color: #004085;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .logs {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .log-entry {
            margin: 5px 0;
            padding: 5px;
        }
        
        .log-success {
            color: green;
        }
        
        .log-error {
            color: red;
        }
        
        .log-info {
            color: blue;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 إنشاء متجر شيخة التجريبي</h1>
        
        <div class="info">
            <strong>سيتم إنشاء:</strong><br>
            ✓ متجر باسم "شيخة"<br>
            ✓ منتج واحد للاختبار<br>
            ✓ صورة سلايدر واحدة<br>
            ✓ اختبار عرض الصور بدون أخطاء CORS
        </div>
        
        <button class="btn-primary" id="createBtn" onclick="createTestStore()">
            🚀 ابدأ الاختبار
        </button>
        
        <div id="status" class="status" style="display: none;"></div>
        
        <div class="logs" id="logs"></div>
        
        <div class="info" style="margin-top: 30px;">
            <strong>ملاحظات مهمة:</strong><br>
            • سيتم التحقق من عدم ظهور أخطاء CORS<br>
            • سيتم التحقق من تحميل الصور بشكل صحيح<br>
            • سيتم التحقق من تعطيل DevTools
        </div>
    </div>

    <script>
        const apiUrl = 'http://localhost:5000/api';
        let logsContainer = document.getElementById('logs');
        
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            entry.textContent = `[${timestamp}] ${message}`;
            logsContainer.appendChild(entry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
            console.log(message);
        }
        
        function showStatus(message, type = 'loading') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
        
        async function createTestStore() {
            const btn = document.getElementById('createBtn');
            btn.disabled = true;
            logsContainer.innerHTML = '';
            
            try {
                showStatus('⏳ جاري إنشاء المتجر...', 'loading');
                log('بدء إنشاء متجر شيخة التجريبي', 'info');
                
                // 1. إنشاء المتجر
                log('الخطوة 1: إنشاء بيانات المتجر', 'info');
                const storeData = {
                    name: 'شيخة',
                    slug: 'shekha-test',
                    description: 'متجر اختبار للتحقق من عرض الصور',
                    category: 'general',
                    ownerName: 'اختبار',
                    ownerEmail: 'test@test.com',
                    ownerPhone: '0123456789',
                    logoUrl: '',
                    bannerUrl: ''
                };
                
                const storeRes = await fetch(`${apiUrl}/stores`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(storeData)
                });
                
                if (!storeRes.ok) {
                    throw new Error(`فشل إنشاء المتجر: ${storeRes.status}`);
                }
                
                const store = await storeRes.json();
                const storeId = store.data?.id || store.id;
                log(`✓ تم إنشاء المتجر بنجاح (ID: ${storeId})`, 'success');
                
                // 2. إنشاء منتج
                log('الخطوة 2: إنشاء منتج للاختبار', 'info');
                const productData = {
                    storeId: storeId,
                    name: 'منتج اختبار',
                    description: 'هذا منتج اختبار للتحقق من عرض الصور',
                    price: 99.99,
                    discount: 0,
                    category: 'عام',
                    subcategory: 'اختبار',
                    stock: 10,
                    images: ['https://via.placeholder.com/300x300?text=Test+Product'],
                    sku: 'TEST-001'
                };
                
                const productRes = await fetch(`${apiUrl}/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });
                
                if (!productRes.ok) {
                    throw new Error(`فشل إنشاء المنتج: ${productRes.status}`);
                }
                
                const product = await productRes.json();
                log(`✓ تم إنشاء المنتج بنجاح`, 'success');
                
                // 3. إنشاء سلايدر
                log('الخطوة 3: إنشاء صورة سلايدر', 'info');
                const sliderData = {
                    storeId: storeId,
                    title: 'سلايدر الاختبار',
                    description: 'صورة الاختبار',
                    image: 'https://via.placeholder.com/1200x400?text=Test+Slider',
                    imagePath: '/assets/shekha-test/sliders/test-slider.jpg',
                    link: '/test',
                    sortOrder: 1,
                    isActive: true
                };
                
                const sliderRes = await fetch(`${apiUrl}/sliders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(sliderData)
                });
                
                if (!sliderRes.ok) {
                    log(`⚠ تحذير: قد يكون هناك مشكلة في إنشاء السلايدر (${sliderRes.status})`, 'info');
                } else {
                    log(`✓ تم إنشاء السلايدر بنجاح`, 'success');
                }
                
                // 4. التحقق
                log('الخطوة 4: اختبار عرض المتجر', 'info');
                setTimeout(() => {
                    const storeUrl = `http://localhost:5173/store/${storeData.slug}`;
                    log(`🔗 رابط المتجر: ${storeUrl}`, 'info');
                    log('يرجى فتح المتجر والتحقق من:', 'info');
                    log('  ✓ تحميل الصور بدون أخطاء CORS', 'info');
                    log('  ✓ ظهور المنتج والسلايدر بشكل صحيح', 'info');
                    log('  ✓ عدم فتح DevTools (محظور في الإنتاج)', 'info');
                    
                    showStatus('✅ تم إنشاء المتجر بنجاح! افتح الرابط أعلاه للاختبار', 'success');
                }, 1000);
                
            } catch (error) {
                log(`❌ خطأ: ${error.message}`, 'error');
                showStatus(`خطأ: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
